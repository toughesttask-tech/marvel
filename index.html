<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marvel Watchlist</title>
  <style>
    :root {
      --bg: #0e0f14;
      --card: #171923;
      --card-2: #1e2130;
      --line: #2a2e42;
      --text: #f2f3f8;
      --muted: #9aa0b8;
      --red: #e62429;
      --gold: #f5c518;
      --green: #2ecc71;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(1200px 500px at 50% -10%, #2a0d12 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      min-height: 100vh;
    }

    .hero {
      text-align: center;
      padding: 48px 16px 24px;
      max-width: 720px;
      margin: 0 auto;
    }
    .eyebrow {
      margin: 0 0 8px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--muted);
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(28px, 6vw, 46px);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .follow { text-transform: none; letter-spacing: .5px; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .follow a { display: inline-flex; align-items: center; gap: 6px; color: var(--text); text-decoration: none; font-weight: 600; }
    .follow a:hover { color: var(--red); }
    .follow-icon { flex-shrink: 0; }
    h1 span { color: var(--red); }
    .logo-title { margin: 0 0 6px; line-height: 0; }
    .logo-title img { display: block; margin: 0 auto; width: min(280px, 70%); height: auto; }
    .subtitle { margin: 0 0 24px; font-size: 13px; letter-spacing: 1px; color: var(--muted); text-align: center; }

    .progress-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
    .progress-text { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; color: var(--muted); }
    .progress-text strong { font-size: 26px; color: var(--text); }
    .percent { margin-left: auto; color: var(--gold); font-weight: 700; }
    .bar { height: 10px; background: var(--card-2); border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--red), var(--gold)); border-radius: 99px; transition: width .4s ease; }

    main { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }

    .sticky-progress {
      position: sticky; top: 0; z-index: 20;
      max-width: 720px; margin: 0 auto;
      padding: 8px 16px 10px;
      background: var(--bg);
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 16px; padding: 10px 0; }
    #search {
      flex: 1 1 220px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
    }
    #search:focus { outline: 2px solid var(--red); border-color: transparent; }
    .filters { display: flex; gap: 6px; }
    .chip {
      padding: 10px 14px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
    }
    .chip.active { background: var(--red); border-color: var(--red); color: #fff; }

    /* saga sections */
    .saga { margin-bottom: 34px; }
    .saga-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      margin: 22px 0 4px; padding-bottom: 8px;
      border-bottom: 2px solid var(--red);
    }
    .saga-head h2 { margin: 0; font-size: 20px; letter-spacing: .5px; }
    .saga-count { color: var(--gold); font-weight: 700; font-size: 14px; white-space: nowrap; }
    .saga-sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }

    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

    .item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      transition: border-color .2s, opacity .2s;
    }
    .item:hover { border-color: #3b4060; }
    .item.done { opacity: .6; }
    .item.done .title { text-decoration: line-through; text-decoration-color: var(--red); }

    .row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .num { width: 28px; text-align: center; color: var(--muted); font-size: 13px; flex-shrink: 0; }
    .info { flex: 1; min-width: 0; }
    .title { font-weight: 600; font-size: 16px; line-height: 1.3; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .badge {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      background: var(--card-2); color: var(--gold);
      padding: 3px 8px; border-radius: 99px; margin-left: 6px; vertical-align: middle;
    }

    /* journey: boy walking to the Doomsday theatre */
    .journey { display: flex; align-items: flex-end; gap: 10px; margin-top: 6px; }
    .track { position: relative; flex: 1; padding-top: 58px; margin-left: 22px; }
    .boy {
      position: absolute; bottom: 5px; left: 0;
      width: 46px; height: 56px;
      transform: translateX(-50%);
      transition: left .9s ease-in-out, opacity .5s, transform .5s;
      pointer-events: none;
    }
    .boy svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .boy-body { animation: bob 1.8s ease-in-out infinite; }
    .boy .leg { transform-box: fill-box; transform-origin: 50% 0; }
    .boy .ticket { transform-box: fill-box; transform-origin: 0 100%; animation: wiggle 1.2s ease-in-out infinite; }
    .boy.walking .boy-body { animation: bob .35s ease-in-out infinite; }
    .boy.walking .leg-l { animation: swing .35s ease-in-out infinite alternate; }
    .boy.walking .leg-r { animation: swing .35s ease-in-out infinite alternate-reverse; }
    @keyframes swing { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes wiggle { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }

    .theatre { width: 84px; flex-shrink: 0; text-align: center; }
    .theatre svg { width: 100%; height: auto; display: block; overflow: visible; }
    .theatre-name { font-size: 10px; color: var(--muted); letter-spacing: .5px; margin-top: 2px; line-height: 1.2; }
    .theatre-date { font-size: 12px; font-weight: 700; color: var(--text); margin-top: 4px; }
    .theatre-days { font-size: 11px; font-weight: 700; color: var(--gold); margin-top: 1px; white-space: nowrap; }
    .bulb { animation: blink 1.2s infinite; }
    .bulb:nth-child(even) { animation-delay: .6s; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .journey.arrived .boy { opacity: 0; transform: translateX(-50%) scale(.3); }
    .journey.arrived .door { fill: #f5c518; }
    .journey.arrived .theatre svg { animation: cheer .6s ease-in-out 3; }
    @keyframes cheer { 50% { transform: scale(1.08); } }
    .journey-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    @media (prefers-reduced-motion: reduce) {
      .boy-body, .boy .ticket, .bulb { animation: none !important; }
    }

    /* where to watch */
    .ott { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
    .ott-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-right: 2px; }
    .ott-badge {
      display: inline-flex; align-items: center;
      font-size: 12px; font-weight: 700;
      color: #fff; background: var(--c, #444);
      padding: 4px 10px; border-radius: 8px;
    }
    .ott-badge.none { background: var(--card-2); color: var(--muted); font-weight: 500; border: 1px dashed var(--line); }
    .ott img { height: 24px; width: auto; border-radius: 6px; display: block; }

    /* custom checkbox */
    input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 24px; height: 24px; flex-shrink: 0;
      border: 2px solid #4a5072; border-radius: 7px;
      background: var(--card-2);
      cursor: pointer; display: grid; place-content: center;
      transition: all .15s;
    }
    input[type="checkbox"]::after {
      content: ""; width: 6px; height: 11px;
      border: solid #fff; border-width: 0 3px 3px 0;
      transform: rotate(45deg) scale(0); transition: transform .15s;
      margin-top: -2px;
    }
    input[type="checkbox"]:checked { background: var(--green); border-color: var(--green); }
    input[type="checkbox"]:checked::after { transform: rotate(45deg) scale(1); }
    input[type="checkbox"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .seasons { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0 40px; }
    .season {
      display: flex; align-items: center; gap: 8px;
      background: var(--card-2); border: 1px solid var(--line);
      padding: 7px 12px; border-radius: 10px; font-size: 14px; cursor: pointer;
    }
    .season input { width: 20px; height: 20px; border-radius: 6px; }
    .season input::after { width: 5px; height: 9px; border-width: 0 2.5px 2.5px 0; }

    .empty { text-align: center; color: var(--muted); padding: 30px 0; }

    .reset {
      display: block; margin: 8px auto 0;
      background: transparent; color: var(--muted);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 16px; cursor: pointer; font-size: 14px;
    }
    .reset:hover { color: #fff; border-color: var(--red); }

    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 0 28px; }

    @media (max-width: 480px) {
      .seasons { margin-left: 0; }
      .num { width: 22px; }
    }
  </style>
</head>

  <script>

    // Movie:  { title: "Name", when: "2012" }

    // Ticks are saved by title, so you can add/reorder items without losing progress.
    // ---------- Where to watch (OTT, India) ----------

    // Use  ott: []  for "not on OTT yet".
    // To show a real logo instead of a coloured name badge, save the logo image
    // next to this file and set  logo: "logos/netflix.png"  for that platform.

      jiohotstar: { name: "JioHotstar",  color: "#1b6fd6", logo: "" },
      netflix:    { name: "Netflix",     color: "#e50914", logo: "" },

    const SAGAS = [
      {

        sub: "In-universe order",
        items: [

    // Give every item a stable id (from its title) and remember its saga.
    const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

    const ALL = SAGAS.flatMap((s) => s.items);

    const KEY = "marvel-watchlist-v2";
    let state = {};
    try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

    const isSeries = (it) => !!it.seasons;
    const isDone = (it) => isSeries(it)
      ? Array.from({ length: it.seasons }, (_, s) => state[`${it.id}-s${s + 1}`]).every(Boolean)

    const searchEl = document.getElementById("search");
    let filter = "all";
    const DOOMSDAY_DATE = new Date(2026, 11, 17); // 17 December 2026 (month is 0-based)
    let lastPct = 0;
    let walkTimer = null;

    function ottHTML(it) {
      const ids = it.ott || DEFAULT_OTT;
      if (!ids.length) {
        return `<div class="ott"><span class="ott-badge none">Not on OTT yet</span></div>`;
      }
      const badges = ids.map((id) => {
        const p = PLATFORMS[id];
        if (!p) return "";
        return p.logo
          ? `<img src="${p.logo}" alt="${p.name}" title="${p.name}">`
          : `<span class="ott-badge" style="--c:${p.color}" title="Watch on ${p.name}">${p.name}</span>`;
      }).join("");
      return `<div class="ott"><span class="ott-label">Watch on</span>${badges}</div>`;
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      listsEl.innerHTML = "";
      let shown = 0;

      SAGAS.forEach((saga) => {
        const sagaDone = saga.items.filter(isDone).length;

        const section = document.createElement("section");
        section.className = "saga";
        section.innerHTML = `
          <div class="saga-head">
            <h2>${saga.name}</h2>
            <span class="saga-count">${sagaDone} / ${saga.items.length}</span>
          </div>
          <p class="saga-sub">${saga.sub}</p>`;
        const ol = document.createElement("ol");
        ol.className = "list";

        saga.items.forEach((it, idx) => {
          const done = isDone(it);
          if (filter === "done" && !done) return;
          if (filter === "todo" && done) return;
          if (q && !it.title.toLowerCase().includes(q)) return;
          shown++;

          const li = document.createElement("li");
          li.className = "item" + (done ? " done" : "");

          const row = document.createElement("label");
          row.className = "row";
          row.innerHTML = `
            <span class="num">${idx + 1}</span>
            <input type="checkbox" ${done ? "checked" : ""} aria-label="Mark ${it.title} as watched">
            <span class="info">
              <span class="title">${it.title}</span>${isSeries(it) ? '<span class="badge">Series</span>' : ""}
              ${it.when ? `<div class="meta">${it.when}</div>` : ""}
              ${ottHTML(it)}
            </span>`;
          row.querySelector("input").addEventListener("change", (e) => {
            if (isSeries(it)) {
              for (let s = 1; s <= it.seasons; s++) state[`${it.id}-s${s}`] = e.target.checked;
            } else {
              state[it.id] = e.target.checked;
            }
            save(); render();
          });
          li.appendChild(row);

          if (isSeries(it)) {
            const wrap = document.createElement("div");
            wrap.className = "seasons";
            for (let s = 1; s <= it.seasons; s++) {
              const k = `${it.id}-s${s}`;
              const lab = document.createElement("label");
              lab.className = "season";
              lab.innerHTML = `<input type="checkbox" ${state[k] ? "checked" : ""}> Season ${s}`;
              lab.querySelector("input").addEventListener("change", (e) => {
                state[k] = e.target.checked;
                save(); render();
              });
              wrap.appendChild(lab);
            }
            li.appendChild(wrap);
          }
          ol.appendChild(li);
        });

        if (ol.children.length) {
          section.appendChild(ol);
          listsEl.appendChild(section);
        }
      });

      emptyEl.hidden = shown > 0;
      updateProgress();
    }

    function updateProgress() {
      const total = ALL.length;
      const done = ALL.filter(isDone).length;
      const pct = Math.round((done / total) * 100);
      document.getElementById("doneCount").textContent = done;
      document.getElementById("totalCount").textContent = total;
      document.getElementById("percent").textContent = pct + "%";
      document.getElementById("barFill").style.width = pct + "%";

      // the little boy walks toward the theatre as you tick titles
      const boy = document.getElementById("boy");
      const journey = document.getElementById("journey");
      if (pct !== lastPct) {
        boy.classList.add("walking");
        clearTimeout(walkTimer);
        walkTimer = setTimeout(() => boy.classList.remove("walking"), 1000);
        lastPct = pct;
      }
      setTimeout(() => { boy.style.left = pct + "%"; }, 60);
      journey.classList.toggle("arrived", done === total);

      // days left until Doomsday (counted from today's date on your device)
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const days = Math.round((DOOMSDAY_DATE - today) / 86400000);
      document.getElementById("daysLeft").textContent =
        days > 1 ? `${days} days left` :
        days === 1 ? "1 day left" :
        days === 0 ? "Releases today!" : "Now in theatres";

      const next = ALL.find((it) => !isDone(it));
      document.getElementById("journeyNote").textContent = next
        ? `${total - done} to go · next: ${next.title}`
        : "All caught up! Ticket in hand, enjoy Avengers: Doomsday in the theatre!";
    }

    // ---------- Events ----------
    searchEl.addEventListener("input", render);
    document.querySelectorAll(".chip").forEach((btn) =>
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        filter = btn.dataset.filter;
        render();
      })
    );
    document.getElementById("reset").addEventListener("click", () => {
      if (confirm("Clear all ticks?")) { state = {}; save(); render(); }
    });

    render();
  </script>
</body>
</html>
